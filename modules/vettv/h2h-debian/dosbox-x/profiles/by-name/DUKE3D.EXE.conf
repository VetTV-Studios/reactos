# id=duke-nukem-3d-shareware-1.3d
# Build engine, DOS4GW: needs dynamic core + max cycles (TCG guest is slow; cap removed deliberately). Music: OPL (FM) because no GM synth is installed; run SETUP.EXE once and pick SB16 for FX and music. Hash unknown (INSTALL.EXE).
[dosbox]
memsize=32
[cpu]
core=dynamic
cputype=pentium
cycles=max
[sblaster]
oplmode=opl3
