# VetTV h2h base: same defaults as the ReactOS vetvdm template where they apply.
[sdl]
# Same display mode vetvdm forces on ReactOS (core/conf.c apply_defaults); no fullresolution set there.
fullscreen=true
autolock=true
output=surface
[dosbox]
machine=svga_s3
memsize=16
[cpu]
core=auto
cputype=auto
cycles=auto
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
oplmode=auto
[midi]
mpu401=none
[log]
logfile=
