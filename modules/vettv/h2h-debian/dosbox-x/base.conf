# VetTV h2h base: same defaults as the ReactOS vetvdm template where they apply.
[sdl]
fullscreen=false
autolock=false
output=surface
[dosbox]
machine=svga_s3
memsize=16
[cpu]
core=auto
cputype=auto
cycles=auto
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
oplmode=auto
[midi]
mpu401=none
[log]
logfile=
